  document.getElementById("chips").innerHTML=secs.map((x,i)=>`<button type="button" data-s="${i}">${x[0]} ${eh(x[1])}</button>`).join("");
  document.getElementById("body").innerHTML=
   `<section class="sec" id="s0"><h2><span aria-hidden="true">${t.stayE}</span>${eh(t.hH)}</h2>
     <div class="callout"><span class="ic" aria-hidden="true">📍</span><div><b>${eh(t.introH)}</b><p>${eh(t.introP)}</p></div></div>
     <div class="hotels">${t.hotels.map((h,i)=>`<article class="hotel ${h.kind}"><div class="band"><span class="num">0${i+1}</span><span class="tag">${eh(h.tag)}</span></div>
       <div class="in"><h3>${eh(h.n)}</h3><p class="d">${eh(h.d)}</p>
       <div class="foot"><div class="price"><b>~${eh(h.p)}</b><small>${eh(t.per)}</small></div><a class="cta" href="${eh(h.u)}" target="_blank" rel="noopener">${eh(t.gL)} →</a></div></div></article>`).join("")}</div>
     <p class="pnote">${eh(t.pN)}</p></section>`+
   t.secs.map(([e,h,it],i)=>`<section class="sec" id="s${i+1}"><h2><span aria-hidden="true">${e}</span>${eh(h)}</h2><ul class="cards">${it.map(([a,b])=>`<li class="card"><b>${eh(a)}</b><p>${eh(b)}</p></li>`).join("")}</ul></section>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang)); }
document.getElementById("chips").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; const s=document.getElementById("s"+b.dataset.s); if(s) s.scrollIntoView({block:"start"}); });
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; try{localStorage.setItem("lang",lang)}catch(e){} apply(); }));
if(window.__lang) lang=window.__lang;
apply();
</script></body></html>
